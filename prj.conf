# GPIO
CONFIG_GPIO=y

# I2C untuk LCD
CONFIG_I2C=y

# PWM untuk servo
CONFIG_PWM=y

# Multithreading
CONFIG_MULTITHREADING=y

# Console dan debugging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Stack
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Heap
CONFIG_HEAP_MEM_POOL_SIZE=1024